name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Un único secret FIREBASE_ENV con el bloque .env completo (multilínea).
      # Si no existe, la app se compila igualmente en Modo Invitado Local.
      - name: Preparar variables de entorno (Firebase)
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          if [ -n "$FIREBASE_ENV" ]; then
            printf '%s\n' "$FIREBASE_ENV" > .env.local
            echo "✔ .env.local creado desde el secret FIREBASE_ENV"
            for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
              grep -q "^$v=." .env.local || echo "⚠️  Falta $v en el secret FIREBASE_ENV"
            done
          else
            echo "⚠️  Sin secret FIREBASE_ENV: la build se desplegará en Modo Invitado Local"
          fi

      - name: Compilar la app
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
